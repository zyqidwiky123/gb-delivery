name: Build Android Release APK

on:
  push:
    tags:
      - 'v*'
  # FASE 3: tombol build manual dari GitHub UI (Actions > Build Android Release
  # APK > Run workflow) — pilih branch (mis. feat/osm-fase-0-3) tanpa perlu tag
  # dan tanpa menyentuh main.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aro-driver-kotlin

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > aro_partner.jks

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > keystore.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../aro_partner.jks
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Create Release
        # Hanya saat trigger tag (v*). Saat build manual (workflow_dispatch),
        # APK diupload sebagai artifact di bawah ini.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ARO DRIVE Driver v${{ github.ref_name }}
          body: |
            ## ARO DRIVE Driver v${{ github.ref_name }}

            Build production dari tag ${{ github.ref_name }}.
            Lihat riwayat commit untuk detail perubahan.
          files: aro-driver-kotlin/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK Artifact (manual build)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aro-driver-release-${{ github.ref_name }}
          path: aro-driver-kotlin/app/build/outputs/apk/release/app-release.apk
