name: Build Android Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aro-driver-kotlin

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > aro_partner.jks

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > keystore.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../aro_partner.jks
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ARO DRIVE Driver v${{ github.ref_name }}
            body: |
             ## ARO DRIVE Driver v${{ github.ref_name }}

             ### Perubahan:
             - Notifikasi seperti WhatsApp: notif tetap muncul meski app diclose (FCM notification payload + channel_id)
             - Restart foreground service otomatis saat FCM diterima
             - WakeLock biar proses gak mati sebelum notif muncul
             - Location heartbeat tiap 5 menit (sebelumnya 15 menit)
             - Maks umur lokasi driver 10 menit (sebelumnya 5 menit)
             - Hapus filter inactivity redundant di dispatch
             - Hapus tombol "Nanti Saja" di izin baterai (wajib)
          files: aro-driver-kotlin/app/build/outputs/apk/release/app-release.apk
